
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const segmentCount = 1;
      const location = window.location;
      const base = location.pathname
        .split("/")
        .slice(0, 1 + segmentCount)
        .join("/");

      const route = location.pathname
        .slice(base.length);

      location.replace(
        base + "/?/" + route.replace(/^\//, "") +
        location.search.replace("?", "&") +
        location.hash
      );
    </script>
  </head>
  <body></body>
</html>
